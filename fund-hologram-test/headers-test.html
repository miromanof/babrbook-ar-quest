<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR MIME диагностика</title></head><body><h1>Проверка файлов AR</h1><pre id="res">Проверка заголовков...</pre><script>(async()=>{let items=["models/demo.usdz","models/demo.glb","index.html"],out=[];for(let u of items){try{let r=await fetch(u+"?check="+Date.now(),{method:"HEAD",cache:"no-store"});out.push(u+" | status="+r.status+" | type="+r.headers.get("content-type")+" | disposition="+r.headers.get("content-disposition")+" | length="+r.headers.get("content-length"));}catch(e){out.push(u+" | error="+e.message)}}document.getElementById("res").textContent=out.join("\n");})();</script></body></html>
